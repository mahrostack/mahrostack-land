# Define global rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=static_limit:10m rate=100r/s;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    
    # Hide Nginx version absolutely
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;

    # Custom Error Pages
    error_page 404 /errors/404.html;
    error_page 429 /errors/429.html;
    error_page 500 502 503 504 /errors/50x.html;

    location ^~ /errors/ {
        internal;
        root /usr/share/nginx/html;
    }

    # Health Check
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Static Assets (High rate limit, aggressive caching)
    location /assets/ {
        limit_req zone=static_limit burst=50 nodelay;
        limit_req_status 429;
        
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Update-critical PWA files — never cache at browser or CDN edge
    location ~* ^/(sw\.js|workbox-.*\.js|registerSW\.js)$ {
        limit_req zone=api_limit burst=5 nodelay;
        limit_req_status 429;

        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
    }

    location ~* \.(?:webmanifest)$ {
        limit_req zone=api_limit burst=5 nodelay;
        limit_req_status 429;

        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }

    # Root-level images/fonts only — JS/CSS live under /assets/ or PWA paths above
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?|ttf|eot)$ {
        limit_req zone=static_limit burst=50 nodelay;
        limit_req_status 429;
        
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Do not cache the dynamic env configuration file
    location = /env-config.js {
        limit_req zone=api_limit burst=5 nodelay;
        limit_req_status 429;

        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }

    # Entry Point (Avoid caching to ensure fresh router loads)
    location = /index.html {
        limit_req zone=api_limit burst=5 nodelay;
        limit_req_status 429;
        
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }

    # SPA Fallback Routing
    location / {
        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 429;
        
        try_files $uri $uri/ @spa;
    }

    location @spa {
        rewrite ^ /index.html break;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }

    # Gzip settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/manifest+json;
}